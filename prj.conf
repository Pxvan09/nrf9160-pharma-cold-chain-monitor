# =====================================================================
# IoT Pharma Monitoring Device - project configuration
#
# TARGET: nRF Connect SDK v2.7.0 or newer (verified against the v2.8
#         API set; also correct for v2.9.x and v3.x).
#
# If you are on v2.6 or older, three symbols below are DIFFERENT and the
# build will fail or, worse, silently fail TLS. See README.md section
# "SDK version matrix" before changing anything.
# =====================================================================

# ---------------------------------------------------------------------
# 1. MANDATORY USER SETTINGS - fill these in before the first build
# ---------------------------------------------------------------------

# From:  aws iot describe-endpoint --endpoint-type iot:Data-ATS
CONFIG_AWS_IOT_BROKER_HOST_NAME="REPLACE-WITH-YOUR-ENDPOINT-ats.iot.eu-central-1.amazonaws.com"

# Must exactly match the AWS IoT Thing name.
CONFIG_AWS_IOT_CLIENT_ID_STATIC="pharma-tracker-001"

# Security tag the device certificate/key/CA were provisioned under.
# NOTE: on NCS <= 2.6 this option is called CONFIG_AWS_IOT_SEC_TAG.
CONFIG_MQTT_HELPER_SEC_TAG=42

# ---------------------------------------------------------------------
# 2. MODEM AND CELLULAR LINK
# ---------------------------------------------------------------------
CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y

# Multimode: try LTE-M and NB-IoT, GNSS enabled.
#   LTE-M  - mobility and handover, needed while the shipment is moving,
#            and fast enough for firmware updates.
#   NB-IoT - best link budget, needed inside a warehouse cold room.
# Letting the modem select gives the best of both across a shipment.
CONFIG_LTE_NETWORK_MODE_LTE_M_NBIOT_GPS=y

# Power Saving Mode. Encoding is 3GPP 24.008 ch. 10.5.7.4a / 10.5.7.3:
#   RPTAU "00100001" -> unit bits 001 = 1 hour, value 00001 = 1  -> ~1 h
#   RAT   "00000000" -> unit bits 000 = 2 s,    value 00000 = 0  -> ~0 s
# A near-zero active timer is what lets the modem drop to the ~2.7 uA
# floor immediately after a transaction instead of idling at ~37 uA.
# The NETWORK may grant different values - watch the PSM_UPDATE log line.
CONFIG_LTE_PSM_REQ=y
CONFIG_LTE_PSM_REQ_RPTAU="00100001"
CONFIG_LTE_PSM_REQ_RAT="00000000"

# Uncomment to lock to the bands you actually deploy on. Band locking
# markedly shortens network search and avoids expensive HPPLMN scans on
# global/roaming SIMs. Bitmask is little-endian, bit 0 = band 1.
# CONFIG_LTE_LOCK_BANDS=y
# CONFIG_LTE_LOCK_BAND_MASK="10000000000010000001000000000000000010100"

# ---------------------------------------------------------------------
# 3. NETWORKING (all sockets are offloaded to the modem)
# ---------------------------------------------------------------------
CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_SOCKETS_POSIX_NAMES=n

# ---------------------------------------------------------------------
# 4. AWS IOT
# ---------------------------------------------------------------------
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y
CONFIG_AWS_IOT=y

# One extra (non-shadow) topic: the device command topic.
CONFIG_AWS_IOT_APP_SUBSCRIPTION_LIST_COUNT=1

# Subscribe to the shadow delta so configuration changes are visible.
CONFIG_AWS_IOT_TOPIC_UPDATE_DELTA_SUBSCRIBE=y

# Payload buffer. Measured worst case is ~1170 B for a 10-record batch;
# 2048 leaves headroom without wasting RAM.
CONFIG_MQTT_HELPER_RX_TX_BUFFER_SIZE=2048
CONFIG_MQTT_HELPER_PAYLOAD_BUFFER_LEN=2048

# Keepalive must be shorter than the cellular NAT timeout or the broker
# will appear to drop the connection at random. 20 min is the AWS
# maximum; many LTE networks NAT-expire well before that.
CONFIG_MQTT_KEEPALIVE=600

# ---------------------------------------------------------------------
# 5. TIME
# ---------------------------------------------------------------------
CONFIG_DATE_TIME=y
CONFIG_DATE_TIME_AUTO_UPDATE=y
CONFIG_DATE_TIME_MODEM=y
CONFIG_DATE_TIME_NTP=y

# ---------------------------------------------------------------------
# 6. PERSISTENT STORAGE (the flash audit buffer)
# ---------------------------------------------------------------------
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# ---------------------------------------------------------------------
# 7. SENSORS
# ---------------------------------------------------------------------
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BME280=y

# PT1000 RTD probe. Only meaningful together with
# overlays/rtd_probe.overlay - see README, "Ultra-cold payloads".
# CONFIG_SPI=y
# CONFIG_MAX31865=y

# ---------------------------------------------------------------------
# 8. SYSTEM
# ---------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=8192

CONFIG_REBOOT=y
CONFIG_ASSERT=y

# Watchdog-style protection against a wedged modem or MQTT thread can be
# added later; see README "Hardening checklist".

# ---------------------------------------------------------------------
# 9. LOGGING
#
# Keep logging ON while bringing the device up. For a battery build turn
# it OFF: an enabled UART console alone costs far more than the 2.7 uA
# PSM floor and will invalidate the power budget.
# ---------------------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_PHARMA_LOG_LEVEL_INF=y

CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y

# We transmit only scaled integers, so no floating point formatter is
# needed. Leaving this off saves flash and avoids soft-double routines.
CONFIG_CBPRINTF_FP_SUPPORT=n

# ---------------------------------------------------------------------
# 10. PRODUCTION POWER PROFILE
#
# Uncomment this whole block for battery measurements and shipping
# firmware. Expect the PSM floor to drop to single-digit microamps only
# after the UART is genuinely disabled.
# ---------------------------------------------------------------------
# CONFIG_LOG=n
# CONFIG_SERIAL=n
# CONFIG_UART_CONSOLE=n
# CONFIG_CONSOLE=n
# CONFIG_PRINTK=n
# CONFIG_ASSERT=n

# ---------------------------------------------------------------------
# Floating-point support  [ADDED AFTER VIRTUAL-RUN VALIDATION]
#
# excursion.c computes Mean Kinetic Temperature using exp() and log()
# from libm. Without a math-capable libc these are undefined symbols and
# the image FAILS TO LINK:
#     undefined reference to `exp'
#     undefined reference to `log'
# This was caught by compiling excursion.c standalone; it is invisible
# until link time, which is why it survived earlier review.
#
# The nRF9160's Cortex-M33 has a hardware FPU. CONFIG_FPU=y makes the MKT
# computation use it instead of soft-float emulation.
#
# Float PRINTF stays off deliberately: payload.c emits integers only
# (centi-Celsius), so pulling in float formatting would cost ~2 kB of
# flash for nothing.
# ---------------------------------------------------------------------
CONFIG_FPU=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=n
